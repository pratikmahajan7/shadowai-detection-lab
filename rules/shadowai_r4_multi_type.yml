title: Multiple PII types to non-sanctioned GenAI-path endpoint
id: 3d5452b2-6654-4517-aeb1-f1eed86ce909
name: shadowai-r4
status: experimental
description: Requires two or more distinct PII types; trades recall for precision.
logsource: {category: proxy, product: saas_egress}
detection:
  ai_path:
    url.path|contains:
      - '/conversation'
      - '/chat'
      - '/completions'
      - '/api/generate'
      - '/api/ask'
  sanctioned:
    domain_category: 'Corporate AI'
  multi:
    pii.types_distinct|gte: 2
  condition: ai_path and multi and not sanctioned
level: medium

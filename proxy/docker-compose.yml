name: shadowai-proxy

services:
  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.3
    container_name: mitmproxy
    command: >
      mitmdump
      -s /addon/capture.py
      --listen-port 8080
      --set confdir=/home/mitmproxy/.mitmproxy
      --set stream_large_bodies=1m
      --set connection_strategy=lazy
    volumes:
      - ./capture.py:/addon/capture.py:ro
      - mitm-ca:/home/mitmproxy/.mitmproxy
      - ../logs:/logs
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  mitm-ca:
